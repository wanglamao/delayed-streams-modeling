# Kyutai STT 1B 中文微调配置 - Docker 版本
# 用于 emilia_25 测试数据集

data:
  train_data: "/nvmedata/ala_storage/ala_data/filtered_zh_2_5m_webdataset/train"
  eval_data: "/nvmedata/ala_storage/ala_data/filtered_zh_2_5m_webdataset/eval"
  shuffle: true
  use_webdataset: true

moshi_paths:
  hf_repo_id: null
  moshi_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/model.safetensors"
  mimi_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/mimi-pytorch-e351c8d8@125.safetensors"
  tokenizer_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/tokenizer_en_fr_audio_8000.model"
  config_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/config.json"

interleaver:
  audio_delay_sec: 0.5  # 改为与原始模型一致 (原始: 0.5s)
  downmix_to_mono: true
  keep_main_only: true
  main_speaker_label: "SPEAKER_MAIN"

run_dir: "/nvmedata/ala_storage/ala_runs/stt_zh_filtered_2_5m_run5"

full_finetuning: true  # 改用 LoRA
lora:
  enable: false  # 启用 LoRA
  rank: 256
  scaling: 2.0
  ft_embed: true

duration_sec: 20
batch_size: 256
max_steps: 10000

gradient_checkpointing: true
max_norm: 1.0  # Gradient clipping
text_padding_weight: 0.2  # 降低 padding token 权重，避免模型过度依赖
optim:
  lr: 2.0e-5
  weight_decay: 0.1
  pct_start: 0.05

seed: 42
log_freq: 1
do_eval: true
eval_freq: 50
do_ckpt: true
ckpt_freq: 500

save_adapters: false  # LoRA 模式下保存 adapter 权重
