# Kyutai STT 1B 中文微调配置 - Docker 版本
# 用于 emilia_25 测试数据集

data:
  train_data: "/root/yiming/ala/delayed-streams-modeling/data/stt_zh_webdataset"
  eval_data: ""
  shuffle: true
  use_webdataset: true

moshi_paths:
  hf_repo_id: null
  moshi_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/model.safetensors"
  mimi_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/mimi-pytorch-e351c8d8@125.safetensors"
  tokenizer_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/tokenizer_en_fr_audio_8000.model"
  config_path: "/nvmedata/ala_storage/stt-1b-en_fr-candle/config.json"

interleaver:
  audio_delay_sec: 0.0
  downmix_to_mono: true
  keep_main_only: true
  main_speaker_label: "SPEAKER_MAIN"

run_dir: "/root/yiming/ala/runs/stt_zh_lora_webdataset_run1"

full_finetuning: false
lora:
  enable: true
  rank: 64
  scaling: 2.
  ft_embed: false

duration_sec: 20
batch_size: 2
max_steps: 40

gradient_checkpointing: true
optim:
  lr: 2.0e-5
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 1
do_eval: false
do_ckpt: true
ckpt_freq: 100

save_adapters: false
